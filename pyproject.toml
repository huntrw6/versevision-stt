[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "versevision-stt"
version = "0.2.4"
description = "Listen to a sermon with Whisper, recognise Bible references and verses, and put them on the ProPresenter output"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.28",
  "platformdirs>=4.3",
  "pydantic>=2.8",
  "rapidfuzz>=3.10",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["hypothesis>=6.100", "pytest>=8"]

[project.scripts]
versevision-stt = "versevision_stt.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/versevision_stt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
